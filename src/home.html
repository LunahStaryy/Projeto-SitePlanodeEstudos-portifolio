<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="home.css">
</head>


<body>
    <div id="tela1">

        <div id="header">
            <p>Seja bem vindo, <span class="username"></span>!</p>
        </div>

    </div>
    <div id="opcoes-container">
        <div id="menu">
            <button id="btmPlanos">Acessar Planos</button>
            <button id="logout">Log Out</button>
        </div>
        <div id="planosExistentes">
            placeholder
        </div>
    </div>


    </div>







    <script>

        const logoutBotao = document.querySelector("#logout")
        logoutBotao.addEventListener('click', async () => {
            const response = await fetch("/logout")
            if (response.status == 204) {
                alert("Usuário Deslogado")
                window.location.href = "/"
                return
            }
        })

        async function init() {
            const response = await fetch("/login/user")
            if (!response.ok) {
                alert("Usuário não logado")
                window.location.href = "/"
                return
            }
            const data = await response.json()
            document.querySelectorAll(".username").forEach(element => {
                element.textContent = data.username
            });
        }
        init()
    </script>


</body>



</html>
